<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>macros</title>
  <style>
    @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-Regular.woff2") format("woff2"); font-style: normal; font-weight: 400; font-display: swap; }
    :root { color-scheme: dark; font-family: "JetBrains Mono", monospace; font-size: 18px; font-weight: 700; color: #fff; background: #000; --muted: #fff; --line: #fff; --accent: #fff; --add: #4ade80; --remove: #ff6464; }

    .app { max-width: 1480px; margin: auto; padding: 30px 36px 24px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 20px; font-weight: 650; letter-spacing: -.7px; }
    .brand svg { width: 26px; height: 26px; color: var(--accent); }
    .intro { text-align: center; margin: 69px 0 44px; }
    h1 { font-size: clamp(1.875rem, 4.5vw, 2.75rem); letter-spacing: -1.8px; margin: 0 0 14px; }
    .toolbar { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 17px; gap: 12px; }
    .toolbar-actions, .dialog-actions, .binding-options { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .positive, .button.positive { color: var(--add); border-color: var(--add); }

    .button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 10px 15px; min-height: 40px; border: 1px solid #fff; border-radius: 8px; background: #000; font-size: 0.75rem; transition: background .15s, border-color .15s; }
    :is(button, select):enabled:hover { background: #333; }
    button:disabled { cursor: default; opacity: .5; }
    .button .count { border-inline-start: 1px solid currentColor; padding-inline-start: 9px; font-size: 0.625rem; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 278px; gap: 18px; align-items: stretch; }
    .card { border: 1px solid var(--line); border-radius: 14px; background: #000; }
    .keyboard-card { position: relative; isolation: isolate; padding: 20px; display: flex; flex-direction: column; min-width: 0; container-type: inline-size; touch-action: none; }
    .card-heading { display: flex; align-items: center; justify-content: flex-end; }
    h2 { font-size: 0.875rem; margin: 0; }

    .keyboard-view { padding: 28px 0; margin: auto 0; min-width: 0; }
    .keyboard { --key-height: clamp(22px, 6cqw, 58px); --key-font: clamp(5px, 1.25cqw, 12px); --key-gap: clamp(2px, .6cqw, 5px); --section-gap: clamp(4px, 1.5cqw, 12px); min-width: 0; width: 100%; padding: var(--section-gap); background: #000; border: 1px solid #fff; border-radius: 11px; display: grid; gap: var(--section-gap); }
    .keyboard[data-layout="TKL"] { --key-height: clamp(20px, 5cqw, 52px); --key-font: clamp(4px, 1.1cqw, 11px); grid-template-columns: minmax(0, 15fr) minmax(0, 3.1fr); }
    .keyboard[data-layout="100%"] { --key-height: clamp(18px, 4.6cqw, 50px); --key-font: clamp(3px, 1cqw, 10px); grid-template-columns: minmax(0, 15fr) minmax(0, 3.1fr) minmax(0, 4.1fr); }
    .keyboard-main { min-width: 0; }

    .key-row:last-child { margin-bottom: 0; }
    .key { position: relative; flex: var(--units, 1) 1 0; min-width: 0; height: var(--key-height); padding: 0; overflow: hidden; border: 1px solid #fff; border-bottom: 3px solid #fff; border-radius: 5px; background: #000; display: flex; align-items: center; justify-content: center; font-size: calc(var(--key-font) * 1.125); color: #fff; transition: background .12s; touch-action: none; }
    .function-row { margin-bottom: var(--section-gap); }
    .key-cluster { min-width: 0; display: grid; grid-template-rows: calc(var(--key-height) + var(--section-gap) - var(--key-gap)) repeat(5, var(--key-height)); gap: var(--key-gap); }
    .navigation { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .key-symbol small { color: #fff; font-size: .85em; }
    .key.selected small { color: #fff; }
    .key.wide { font-size: calc(var(--key-font) * .9); }
    .key svg { width: 13px; height: 13px; }
    .details { align-self: start; height: 420px; padding: 23px 22px; display: flex; flex-direction: column; min-width: 0; }
    .deselect { align-self: flex-end; grid-column: 1 / -1; justify-self: end; padding: 5px; border: 0; border-radius: 4px; color: var(--remove); background: #000; font-size: 0.625rem; white-space: nowrap; }
    .selection-box { position: absolute; z-index: 1; pointer-events: none; border: 1px solid #fff; background: #ffffff1a; }

    .selection h2 { margin-bottom: 5px; }
    .status { color: var(--muted); font-size: 0.6875rem; }
    .empty-state { text-align: center; padding: 24px 0; margin: auto 0; }
    .empty-icon { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 10px; color: var(--add); margin: 0 auto 12px; }
    h3 { font-size: 0.8125rem; margin: 0 0 8px; }
    .empty-state p { color: var(--muted); font-size: 0.6875rem; line-height: 1.8; margin: 0; }
    .primary { width: 100%; background: #000; color: var(--add); border-color: var(--add); }
    .remove { width: 100%; margin-top: 10px; color: var(--remove); border-color: var(--remove); }
    dialog { width: min(440px, calc(100% - 32px)); max-height: 85vh; overflow-y: auto; color: #fff; background: #000; border: 1px solid #fff; border-radius: 15px; padding: 25px; box-shadow: none; }
    dialog::backdrop { background: #000b; backdrop-filter: blur(5px); }
    .dialog-heading { display: flex; justify-content: space-between; align-items: center; }
    .dialog-heading h2 { font-size: 1.1875rem; }
    .close { border: 0; padding: 7px; background: #000; color: var(--muted); display: grid; place-items: center; border-radius: 5px; }
    .dialog-copy { color: var(--muted); font-size: 0.75rem; line-height: 1.7; margin: 10px 0 20px; }
    .close.negative { color: var(--remove); }
    #delete-question { font-size: 1.125rem; line-height: 1.6; overflow-wrap: anywhere; }
    #delete-confirmation .button { min-height: 48px; font-size: 1rem; }
    .macro-option { width: 100%; text-align: left; display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); background: #000; padding: 15px; border-radius: 8px; margin-top: 8px; }
    .macro-option strong { display: block; font-size: 0.75rem; margin-bottom: 5px; }
    .macro-option small { color: var(--muted); font-size: 0.6875rem; }
    .key.unsupported { border-color: var(--remove); }
    .macro-row { display: flex; gap: 6px; align-items: center; }
    .macro-row .macro-option { flex: 1; min-width: 0; }
    .macro-row .close { margin-top: 8px; font-size: 0.6875rem; }
    .binding-options { margin: 15px 0; font-size: 0.6875rem; }
    .binding-options label { display: flex; align-items: center; gap: 5px; }
    input[type="checkbox"] { accent-color: var(--add); }
    .field { display: grid; gap: 7px; margin: 15px 0; font-size: 0.6875rem; }
    input:not([type="checkbox"]), textarea, .event-fields select { width: 100%; min-width: 0; padding: 10px; border: 1px solid #fff; border-radius: 6px; background: #000; color: #fff; font-size: 0.75rem; }
    textarea { resize: vertical; }
    #editor, #macro-form { display: flex; flex-direction: column; flex: 1; width: 100%; }
    .macro-flow { display: flex; flex-direction: column; min-height: 100vh; }
    .flow-header, .macro-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .flow-progress { display: flex; gap: 22px; margin: 24px 0 30px; padding: 0; list-style: none; font-size: 0.6875rem; }
    .flow-progress li { padding-bottom: 9px; border-bottom: 1px solid #555; color: #aaa; }
    .flow-progress li[aria-current="step"] { color: #fff; border-color: #fff; }
    .events-page .flow-header .button, #editor .button:not(.event-add) { min-height: 56px; padding: 14px 22px; font-size: 1.125rem; }
    .events-page .flow-progress { gap: 32px; font-size: 1rem; }
    .setup-page { width: 100%; max-width: 720px; margin: clamp(40px, 10vh, 100px) auto; }
    .setup-page h1 { font-size: 2.125rem; letter-spacing: -1px; }
    .setup-page .field { margin: 30px 0 20px; }
    .setup-page input { padding: 14px; font-size: 1rem; }
    #macro-type-page { text-align: center; }
    #type-title:focus { outline: none; }
    .type-options { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; max-width: 560px; margin: 28px auto 0; }
    .type-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; min-height: 200px; padding: 28px; border: 1px solid #777; border-radius: 10px; background: #000; text-align: center; }
    .type-card:enabled:hover { border-color: #fff; }
    .type-card strong { font-size: 1.3125rem; }
    .type-card svg { width: 64px; height: 64px; }
    .macro-heading h1 { font-size: 2.5rem; letter-spacing: -.8px; margin: 0; overflow-wrap: anywhere; }
    .macro-kind { border: 1px solid #777; border-radius: 5px; padding: 10px 16px; font-size: 1rem; white-space: nowrap; }
    .builder-intro { margin-bottom: 18px; }
    .builder-workspace { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; gap: 40px; margin-top: 32px; }
    .builder-workspace.has-event-fields { grid-template-columns: minmax(0, 1fr) 320px; }
    .sequence-panel { min-width: 0; }
    .record-bar, .builder-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .record-status { color: var(--remove); font-size: 1.125rem; line-height: 1.7; }
    .event-sequence { display: flex; flex-wrap: wrap; align-items: start; gap: 30px 24px; padding: 28px 6px 8px; }
    .event-block { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 80px; max-width: 100%; padding: 0; border: 0; background: transparent; text-align: center; cursor: grab; }
    .event-block:enabled:hover { background: transparent; }
    .event-visual { display: grid; place-items: center; min-width: 80px; height: 80px; padding: 12px; border: 1px solid #fff; border-bottom: 4px solid #fff; border-radius: 8px; background: #000; color: #fff; font-size: 1.625rem; }
    .event-block[aria-pressed="false"]:enabled:hover .event-visual { background: #222; }

    .event-block.drop-before { box-shadow: -3px 0 var(--add); }
    .event-block.dragging { opacity: .4; }
    .event-chord { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
    .event-key { min-width: 80px; }
    .event-key.wide { max-width: 160px; font-size: 1rem; overflow-wrap: anywhere; }
    .event-caption { font-size: 0.8125rem; line-height: 1.5; }
    .event-visual svg { width: 48px; height: 54px; stroke-width: 2; }
    .event-mouse .mouse-button { fill: #fff; stroke: none; }
    .event-mouse .mouse-wheel { stroke: #000; }

    .event-image { width: 112px; padding: 6px; }
    .event-image img, .image-entry img { display: block; width: 100%; height: 100%; min-height: 0; object-fit: contain; }
    .event-image-caption { max-width: 160px; overflow-wrap: anywhere; }
    .event-flow { display: grid; flex-basis: 100%; gap: 10px; min-width: 0; }
    .event-condition { justify-self: start; flex-direction: row; align-items: baseline; gap: 10px; min-width: 0; min-height: 44px; padding: 8px; margin-inline-start: -8px; border-radius: 6px; text-align: start; }
    .event-condition:enabled:hover, .event-condition[aria-pressed="true"] { background: #222; }
    .event-condition-keyword { flex: none; color: #facc15; font-size: 1.25rem; }
    .event-condition-summary { min-width: 0; overflow-wrap: anywhere; }
    .event-condition-image { color: #22d3ee; }
    .event-branches { display: grid; gap: 16px; min-width: 0; margin-inline-start: 6px; padding-inline-start: min(3%, 20px); border-inline-start: 1px solid #777; }
    .event-branch { container-type: inline-size; min-width: 0; }
    .event-branch-label { margin: 0 0 8px; font-size: 1rem; }
    .event-branch > .event-sequence { gap: 18px 16px; padding: 0; }
    @container (max-width: 350px) { .event-branches { margin-inline-start: 0; padding-inline-start: 0; border-inline-start: 0; } }
    .event-picker.drop-before { box-shadow: -3px 0 var(--add); }
    .event-add { width: 80px; height: 80px; }
    .event-add svg { width: 44px; height: 44px; stroke-width: 2; }
    .event-branch .event-add { width: 52px; min-width: 0; height: 52px; padding: 6px; }
    .event-branch .event-add svg { width: 28px; height: 28px; }
    .event-picker { position: relative; }
    .event-menu { position: absolute; z-index: 3; top: calc(100% + 8px); left: 0; display: flex; flex-direction: column; min-width: 240px; padding: 8px; border: 1px solid #fff; border-radius: 8px; background: #000; }
    .event-menu-options { display: grid; gap: 6px; overflow-y: auto; overscroll-behavior-y: contain; }
    .event-menu[data-scrollable]::before, .event-menu[data-scrollable]::after {
      content: ""; align-self: center; flex: none; margin: 4px 0; border-inline: 6px solid transparent; visibility: hidden;
    }
    .event-menu[data-scrollable]::before { border-bottom: 6px solid currentColor; }
    .event-menu[data-scrollable]::after { border-top: 6px solid currentColor; }
    .event-menu[data-more-above]::before, .event-menu[data-more-below]::after { visibility: visible; }
    .event-menu button { min-height: 54px; padding: 14px 18px; border: 0; border-radius: 4px; background: transparent; color: #fff; font-size: 1.125rem; text-align: left; }
    .event-menu button:focus-visible { outline-offset: 0; }

    .recording-menu input[type="checkbox"] { width: 22px; height: 22px; margin: 0; flex-shrink: 0; }
    .event-inspector { position: sticky; top: 24px; min-width: 0; }
    .event-fields .field { gap: 10px; margin: 20px 0 0; font-size: 1rem; }
    .event-fields input, .event-fields select, .event-fields textarea { min-height: 56px; padding: 14px; font-size: 1.125rem; }
    .event-fields textarea { min-height: 140px; }
    .event-fields .button { width: 100%; margin-top: 14px; }
    .record-bar { justify-content: flex-start; flex-wrap: wrap; margin: 24px 0 0; }
    .record-tools { display: flex; gap: 12px; }
    .recording-menu label:has(input:disabled) { opacity: .5; cursor: default; }

    .dialog-actions { justify-content: space-between; margin-top: 18px; }
    .empty-library { padding: 20px 0; font-size: 0.75rem; }
    #images-dialog { width: min(660px, calc(100% - 32px)); }
    .image-tools { margin: 16px 0; }

    .image-rename { display: flex; gap: 8px; }
    .image-rename input { min-width: 0; flex: 1; }
    #images-status[data-error="true"] { color: var(--remove); }

    .toast[data-tone="error"] { color: var(--remove); }
    .toast[data-tone="success"] { color: var(--add); }
    #recovery-notice { padding: 12px 16px; margin-bottom: 16px; font-size: 0.75rem; line-height: 1.5; }
    #save-recovered { margin-top: 8px; }
    [hidden] { display: none !important; }
    @media (min-width: 1400px) { .app { padding-top: 40px; } .intro { margin-top: 85px; margin-bottom: 52px; } }
    @media (max-width: 960px) { .app { padding: 24px; } .workspace { grid-template-columns: minmax(0, 1fr); } .details { height: 280px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; align-items: center; } .selection { border-bottom: 0; } .empty-state { grid-column: 2; padding: 12px 0; } .empty-icon { display: none; } .primary, .remove { grid-column: 1 / -1; } .intro { margin-top: 45px; } }

<body>
  <div class="app" id="keyboard-page">
    <header class="topbar">
      <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h13v5a6.5 6.5 0 0 1-13 0V9Zm13 1h1a3 3 0 0 1 0 6h-1M3 21h16M8 3v3m5-4v4"/></svg>tea</div>
    </header>
    <main>
      <div class="intro">
        <h1>macros</h1>
      </div>
      <div class="toolbar">
        <div class="toolbar-actions"><button class="button negative" id="stop-playback" hidden>stop playback</button><button class="button negative" id="stop-hotkey">stop hotkey: esc</button><button class="button positive" id="record-hotkey">record hotkey: not set</button><button class="button" id="open-macros">macros <span class="count" id="macro-count">0</span></button></div>
      </div>
      <section class="card" id="recovery-notice" aria-label="data recovery" hidden>
        <p id="configuration-recovery" role="status" hidden></p>
        <p id="images-recovery" role="status" hidden></p>
        <button class="button" id="save-recovered" hidden>save recovered configuration</button>
      </section>
      <div class="workspace">
        <section class="card keyboard-card" id="keyboard-panel" aria-label="keyboard">
          <div class="card-heading"><select class="layout-tag" id="layout" aria-label="keyboard form factor"><option value="60%">60%</option><option value="65%">65%</option><option value="75%">75%</option><option value="TKL">tkl (80%)</option><option value="100%">100%</option></select></div>
          <div class="keyboard-view" role="region" aria-label="keyboard layout"><div class="keyboard" id="keyboard" role="group" aria-label="choose keys"></div></div>
          <div class="selection-box" id="selection-box" aria-hidden="true" hidden></div>
        </section>
        <aside class="card details" aria-label="key assignments">
          <button class="deselect" id="deselect" hidden>deselect all</button>
          <div class="selection"><div class="selected-cap" id="selected-cap">0</div><div><h2 id="selected-name">0 keys selected</h2><span class="status" id="selected-status">0 assigned</span></div></div>
          <div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></div><h3 id="macro-title">select a key</h3><p id="macro-description"></p></div>
          <button class="button primary" id="assign" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span id="assign-label">assign macro</span></button>
          <button class="button remove" id="remove" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg><span id="remove-label">remove assignment</span></button>
        </aside>
      </div>
    </main>
  </div>
  <dialog id="macros" aria-labelledby="macros-title">
    <div class="dialog-heading"><h2 id="macros-title">your macros</h2><button class="close" id="close-macros" aria-label="close macros"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
    <p class="dialog-copy" id="dialog-copy"></p>

    </section>
    <section class="setup-page" id="macro-type-page" aria-labelledby="type-title" hidden>
      <h1 id="type-title" tabindex="-1">macro type</h1>
      <div class="type-options"><button class="type-card" data-macro-type="no-repeat"><strong>no repeat</strong><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button><button class="type-card" data-macro-type="toggle"><strong>toggle</strong><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.8 0 5.5 1.1 7.5 3L21 9m0-6v6h-6"/></svg></button></div>
    </section>
    <section id="editor" aria-labelledby="editor-title" hidden>
    <form id="macro-form">
      <div class="builder-intro"><div class="macro-heading"><h1 id="editor-title" tabindex="-1">new macro</h1><span class="macro-kind" id="editor-type">no repeat</span></div></div>
      <div class="record-bar">
        <div class="event-picker">
          <button class="button" type="button" id="record-settings" aria-expanded="false" aria-controls="record-settings-menu" aria-haspopup="true">recording settings</button>
          <div class="event-menu recording-menu" id="record-settings-menu" role="group" aria-label="recording settings" hidden>
            <div class="event-menu-options">
              <label><input type="checkbox" id="record-delays" data-record-option="delays" checked>record delays</label>
              <label><input type="checkbox" id="record-keyboard" data-record-option="keyboard" checked>record keystrokes</label>
              <label><input type="checkbox" id="record-split-keys" data-record-option="splitKeyEvents">split key down / release</label>
              <label><input type="checkbox" id="record-mouse" data-record-option="mouseButtons" checked>record mouse clicks</label>

              <div class="event-menu-options">
                <button type="button" role="menuitem" data-add-event="if-else">if / else</button>
